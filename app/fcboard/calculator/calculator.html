<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>Calculator</title>
    <style>
      :root {
        /* Default Theme: Sky Blue (Matching Index) */
        --color-brand-50: 240 249 255;
        --color-brand-100: 224 242 254;
        --color-brand-500: 14 165 233;
        --color-brand-600: 2 132 199;
        --color-brand-900: 12 74 110;
      }

      /* Smooth Transitions */
      body,
      div,
      button,
      input,
      span,
      i {
        transition-property: background-color, border-color, color, fill, stroke,
          transform, opacity, box-shadow;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 300ms;
      }

      /* Glassmorphism */
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      }

      .dark .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      /* Mesh Gradient Background */
      .bg-gradient-mesh {
        background-color: #f3f3f3;
        background-image: radial-gradient(
            at 0% 0%,
            rgba(var(--color-brand-100), 0.6) 0,
            transparent 50%
          ),
          radial-gradient(
            at 100% 100%,
            rgba(var(--color-brand-50), 0.6) 0,
            transparent 50%
          );
        background-size: 100% 100%;
        background-attachment: fixed;
      }

      .dark .bg-gradient-mesh {
        background-color: #0f172a;
        background-image: radial-gradient(
            at 0% 0%,
            rgba(var(--color-brand-900), 0.4) 0,
            transparent 50%
          ),
          radial-gradient(
            at 100% 0%,
            rgba(var(--color-brand-900), 0.2) 0,
            transparent 50%
          );
      }

      /* Button Press Effect */
      .btn-press:active,
      .btn-active {
        transform: scale(0.95);
        filter: brightness(0.9);
      }

      /* Custom Scrollbar for History */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }

      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.5);
        border-radius: 20px;
      }

      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(71, 85, 105, 0.5);
      }

      @media only screen and (max-width: 400px) {
        .glass-panel {
          width: 100%;
          height: 100vh;
        }

        #result-display {
          font-size: 2.5rem;
        }

        .bg-gradient-mesh {
          background: rgba(255, 255, 255, 0.7);
        }

        .glass-panel {
          background: rgba(255, 255, 255, 0.7);
          box-shadow: 0 0px 0px 0 rgba(31, 38, 135, 0.07);
        }

        .dark .glass-panel {
          background: rgba(15, 23, 42, 0.6);
          box-shadow: 0 0px 0px 0 rgba(0, 0, 0, 0.3);
          border: none;
          outline: none;
        }
      }

      @media only screen and (min-width: 400px) {
        #result-display {
          font-size: 2.8rem;
        }
      }

      @media only screen and (max-height: 737px) {
        .glass-panel {
          height: auto;
        }
      }

      :root {
        --color-brand-50: 255 247 237;
        --color-brand-100: 255 237 213;
        --color-brand-500: 255 159 10;
        --color-brand-600: 247 139 0;
        --color-brand-900: 124 45 18;
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      body,
      div,
      button,
      input,
      span,
      i {
        transition-duration: 180ms;
      }

      body.bg-gradient-mesh {
        background-color: #e9e9ed;
        background-image: radial-gradient(
            ellipse at 14% 12%,
            rgba(255, 159, 10, 0.12),
            transparent 34%
          ),
          radial-gradient(
            ellipse at 88% 86%,
            rgba(83, 105, 255, 0.12),
            transparent 38%
          );
      }

      .dark body.bg-gradient-mesh,
      .dark .bg-gradient-mesh {
        background-color: #09090b;
        background-image: radial-gradient(
            ellipse at 16% 12%,
            rgba(255, 159, 10, 0.1),
            transparent 34%
          ),
          radial-gradient(
            ellipse at 90% 86%,
            rgba(80, 87, 120, 0.12),
            transparent 40%
          );
      }

      #calculator-wrapper {
        max-width: 440px;
        padding: 20px;
      }

      #calculator-wrapper.scientific-open {
        max-width: 840px;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 32px;
        box-shadow: 0 30px 80px rgba(26, 27, 36, 0.14);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
      }

      .dark .glass-panel {
        background: rgba(24, 24, 27, 0.93);
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: 0 34px 90px rgba(0, 0, 0, 0.48);
      }

      #calculator-wrapper > .glass-panel {
        border-width: 1px;
      }

      #calculator-wrapper .flex-1.flex.flex-col.px-3 {
        padding: 20px;
      }

      #calculator-wrapper .grid.grid-cols-4.gap-3 > button {
        width: min(100%, 72px);
        height: auto;
        aspect-ratio: 1;
        min-width: 0;
        justify-self: center;
        border: 0;
        border-radius: 50%;
        box-shadow: none;
        font-size: 1.35rem;
        font-weight: 500;
        transition: transform 120ms ease, filter 120ms ease,
          background-color 180ms ease;
      }

      #calculator-wrapper .grid.grid-cols-4.gap-3 > button[data-key="Escape"],
      #calculator-wrapper
        .grid.grid-cols-4.gap-3
        > button[data-key="Backspace"],
      #calculator-wrapper .grid.grid-cols-4.gap-3 > button[data-key="%"] {
        background: #a5a5a7;
        color: #161616;
        font-weight: 600;
      }

      .dark
        #calculator-wrapper
        .grid.grid-cols-4.gap-3
        > button[data-key="Escape"],
      .dark
        #calculator-wrapper
        .grid.grid-cols-4.gap-3
        > button[data-key="Backspace"],
      .dark #calculator-wrapper .grid.grid-cols-4.gap-3 > button[data-key="%"] {
        background: #a5a5a7;
        color: #111;
      }

      #calculator-wrapper .grid.grid-cols-4.gap-3 > button[data-key="+"],
      #calculator-wrapper .grid.grid-cols-4.gap-3 > button[data-key="-"],
      #calculator-wrapper .grid.grid-cols-4.gap-3 > button[data-key="*"],
      #calculator-wrapper .grid.grid-cols-4.gap-3 > button[data-key="/"],
      #calculator-wrapper .grid.grid-cols-4.gap-3 > button[data-key="Enter"] {
        background: #ff9f0a;
        color: #fff;
        font-size: 1.8rem;
        font-weight: 500;
      }

      #calculator-wrapper .grid.grid-cols-4.gap-3 > button[data-key="Enter"] {
        background: #f28c00;
      }

      #calculator-wrapper
        .grid.grid-cols-4.gap-3
        > button:not([data-key="Escape"]):not([data-key="Backspace"]):not([data-key="%"]):not([data-key="+"]):not([data-key="-"]):not([data-key="*"]):not([data-key="/"]):not([data-key="Enter"]) {
        background: #e5e5e7;
        color: #171719;
      }

      .dark
        #calculator-wrapper
        .grid.grid-cols-4.gap-3
        > button:not([data-key="Escape"]):not([data-key="Backspace"]):not([data-key="%"]):not([data-key="+"]):not([data-key="-"]):not([data-key="*"]):not([data-key="/"]):not([data-key="Enter"]) {
        background: #333336;
        color: #f5f5f7;
      }

      #calculator-wrapper .grid.grid-cols-4.gap-3 > button:hover {
        filter: brightness(1.08);
      }

      #calculator-wrapper .grid.grid-cols-4.gap-3 > button:active,
      #calculator-wrapper .grid.grid-cols-4.gap-3 > button.btn-active {
        transform: scale(0.91);
        filter: brightness(0.88);
      }

      #result_display_container {
        min-height: 156px;
        padding: 12px 8px 16px;
      }

      #history-display {
        color: #929298;
        font-size: 0.9rem;
        min-height: 1.5rem;
      }

      #input-display {
        color: #929298;
        font-size: 1rem;
        min-height: 1.75rem;
      }

      #result-display {
        height: auto;
        min-height: 62px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: clip;
        font-size: clamp(2rem, 9vw, 3.4rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 1.15;
      }

      #result-display.calculator-long-result {
        font-size: clamp(1.45rem, 6vw, 2.2rem);
      }

      #result-display.calculator-error {
        color: #ff6b5e;
        font-size: 2.4rem;
      }

      #btn-basic,
      #btn-scientific {
        padding: 1px 18px;
        padding-right: 24px;
        color: #8b8b92;
      }

      #btn-basic.mode-selected,
      #btn-scientific.mode-selected {
        color: #1b1b1d;
      }

      .dark #btn-basic.mode-selected,
      .dark #btn-scientific.mode-selected {
        color: #fff;
      }

      #mode-indicator {
        background: #fff;
      }

      .dark #mode-indicator {
        background: #4a4a4e;
      }

      #scientific-panel {
        background: transparent;
        height: min(78dvh, 680px);
        max-height: min(calc(100dvh - 40px), 680px);
        overflow: hidden;
        align-self: center;
      }

      #scientific-panel > .grid {
        flex: 1 1 auto;
        min-height: 0;
        align-content: start;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      #scientific-panel > .grid::-webkit-scrollbar,
      #mobile-scientific-drawer::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      #scientific-panel .grid button,
      #mobile-scientific-drawer button {
        border-radius: 14px;
        font-size: 0.98rem;
        transition: transform 120ms ease, background-color 180ms ease;
      }

      #scientific-panel .grid button:active,
      #mobile-scientific-drawer button:active {
        transform: scale(0.94);
      }

      #btn-inv.inverse-active,
      #mobile-btn-inv.inverse-active {
        background-color: #ff9f0a;
        color: #fff;
      }

      #mobile-scientific-drawer {
        max-height: min(42dvh, 360px);
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      #mobile-scientific-drawer button {
        min-height: 44px;
        padding: 4px;
      }

      @media (max-width: 480px) {
        #calculator-wrapper {
          width: 100%;
          max-width: 440px;
          padding: 0;
        }

        #calculator-wrapper > .glass-panel {
          min-height: 100vh;
          min-height: 100dvh;
          border-radius: 0;
          border: 0;
          justify-content: space-between;
        }

        #calculator-wrapper .flex-1.flex.flex-col.px-3 {
          padding: max(18px, env(safe-area-inset-top)) 20px
            max(24px, env(safe-area-inset-bottom));
        }

        #calculator-wrapper .grid.grid-cols-4.gap-3 > button {
          font-size: 1.4rem;
        }

        #result_display_container {
          min-height: 180px;
          margin-bottom: 12px;
        }
      }

      @media (max-width: 360px) {
        #calculator-wrapper .flex-1.flex.flex-col.px-3 {
          padding-left: 12px;
          padding-right: 12px;
        }

        #calculator-wrapper .grid.grid-cols-4.gap-3 {
          gap: 8px;
        }

        #mobile-scientific-drawer {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;
          max-height: min(42dvh, 360px);
        }
      }

      @media (max-width: 767px) {
        #calculator-wrapper,
        #calculator-wrapper.scientific-open {
          max-width: 440px;
        }
      }

      @media (max-height: 700px) and (min-width: 481px) {
        #calculator-wrapper .grid.grid-cols-4.gap-3 > button {
          height: auto;
        }

        #result_display_container {
          min-height: 115px;
        }
      }

      @media (orientation: landscape) and (max-width: 900px) {
        #calculator-wrapper,
        #calculator-wrapper.scientific-open {
          max-width: min(100vw, 840px);
        }

        #calculator-wrapper > .glass-panel {
          min-height: 100vh;
        }

        #calculator-wrapper .flex-1.flex.flex-col.px-3 {
          padding-top: 12px;
          padding-bottom: 12px;
        }

        #result_display_container {
          min-height: 96px;
          margin-bottom: 8px;
        }

        #scientific-panel {
          max-height: calc(100dvh - 24px);
        }

        #mobile-scientific-drawer {
          max-height: min(42dvh, 220px);
        }

        #calculator-wrapper .grid.grid-cols-4.gap-3 > button {
          width: min(12vh, 56px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
      /* Local layout replaces the reference's CDN utilities in the calculator-sized iframe. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 16px system-ui, sans-serif;
        color: #171719;
        background: #f4f4f5;
      }
      .dark body {
        background: #18181b;
        color: #fff;
      }
      button {
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
        border: 0;
      }
      button:focus-visible {
        outline: 3px solid #2563eb;
        outline-offset: 2px;
      }
      #calculator-wrapper,
      #calculator-wrapper.scientific-open {
        width: 100%;
        max-width: none;
        padding: 0;
      }
      #calculator-wrapper > .glass-panel {
        display: flex;
        flex-direction: column;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      #calculator-wrapper > .glass-panel > .flex-1 {
        display: flex;
        flex-direction: column;
        padding: 12px;
      }
      #calculator-wrapper > .glass-panel > .flex-1 > div:first-child {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      #calculator-wrapper > .glass-panel > .flex-1 > div:first-child > div {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #calculator-wrapper
        > .glass-panel
        > .flex-1
        > div:first-child
        > div:last-child
        > div {
        display: flex;
        align-items: center;
        position: relative;
        border-radius: 24px;
        background: #e5e5e7;
      }
      .dark
        #calculator-wrapper
        > .glass-panel
        > .flex-1
        > div:first-child
        > div:last-child
        > div {
        background: #333336;
      }
      #mode-indicator {
        display: none;
      }
      #btn-basic,
      #btn-scientific {
        border-radius: 24px;
        min-height: 36px;
        padding: 8px 12px;
        background: none;
        font-size: 13px;
      }
      #theme-toggle {
        width: 36px;
        height: 36px;
        position: relative;
        background: #e5e5e7;
        border-radius: 50%;
        color: inherit;
        display: grid;
        place-items: center;
      }
      .dark #theme-toggle {
        background: #333336;
      }
      #theme-toggle i {
        font-style: normal;
      }
      #icon-moon,
      .dark #icon-sun {
        display: none;
      }
      .dark #icon-moon {
        display: inline;
      }
      #result_display_container {
        text-align: right;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 130px;
        padding: 8px;
      }
      #history-display,
      #input-display {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #result-display {
        overflow-x: auto;
        max-width: 100%;
        scrollbar-width: none;
      }
      #calculator-wrapper .grid-cols-4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      #calculator-wrapper .grid.grid-cols-4.gap-3 > button {
        width: 100%;
        height: 54px;
        min-height: 44px;
        aspect-ratio: auto;
        border-radius: 22px;
      }
      #calculator-wrapper > .glass-panel > .hidden {
        display: none !important;
      }
      #mobile-scientific-drawer {
        padding: 0 12px 12px;
        gap: 8px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      #mobile-scientific-drawer.grid {
        display: grid;
      }
      #mobile-scientific-drawer.hidden {
        display: none;
      }
      #mobile-scientific-drawer button {
        min-height: 44px;
        background: #e5e5e7;
        color: #222;
      }
      .dark #mobile-scientific-drawer button {
        background: #333336;
        color: #fff;
      }
      #mobile-scientific-drawer button.inverse-active {
        background: #ff9f0a;
        color: #fff;
      }
      @media (max-width: 340px) {
        #calculator-wrapper .grid.grid-cols-4.gap-3 > button {
          height: 46px;
        }
        #result_display_container {
          min-height: 110px !important;
        }
      }

      /* The object supplies both dimensions; controls reflow in its full viewport. */
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #calculator-wrapper,
      #calculator-wrapper.scientific-open {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        margin: 0;
        transform: none;
      }
      #calculator-wrapper > .glass-panel {
        width: 100%;
        height: 100% !important;
        max-height: none !important;
        box-sizing: border-box;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
      }
      #calculator-wrapper > .glass-panel > .flex-1 {
        flex: 1;
        min-width: 0;
        min-height: 0;
        box-sizing: border-box;
        padding: clamp(3px, 2vmin, 14px) !important;
        gap: clamp(2px, 1vmin, 8px);
      }
      #calculator-wrapper #calculator-header {
        display: flex;
        flex: 0 0 clamp(22px, 5vh, 36px);
        align-items: center;
        gap: 2px;
        margin: 0;
        touch-action: none;
      }
      #calculator-title {
        flex: 1;
        min-width: 12px;
        font: clamp(9px, 3.5vw, 16px) system-ui;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: move;
      }
      #calculator-header button {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        min-width: 0;
        min-height: 20px;
        height: 20px;
        padding: 2px 3px;
        font: clamp(9px, 3vw, 14px) system-ui;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: inherit;
      }
      #calculator-header #theme-toggle,
      #calculator-header #calculator-close {
        width: 20px;
        height: 20px;
      }
      #calculator-header svg {
        width: 14px;
        height: 14px;
      }
      #calculator-header button.mode-selected {
        color: #ff9f0a;
        background: #8882;
      }
      #calculator-wrapper #result_display_container {
        flex: 0 1 23%;
        min-height: 0 !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #calculator-wrapper #result-display {
        font-size: clamp(16px, min(12vw, 8vh), 64px) !important;
        line-height: 1.15;
        min-height: 0;
        height: auto;
        white-space: nowrap;
      }
      #input-display,
      #history-display {
        min-height: 0;
        height: auto;
        flex-shrink: 1;
        font: clamp(9px, min(4vw, 3vh), 22px) / 1.15 monospace;
      }
      #calculator-wrapper .grid.grid-cols-4.gap-3 {
        flex: 1;
        min-height: 0;
        gap: clamp(2px, 1.4vmin, 10px) !important;
        grid-template-rows: repeat(5, minmax(0, 1fr));
        grid-auto-rows: minmax(0, 1fr);
        align-content: stretch;
      }
      #calculator-wrapper .grid.grid-cols-4.gap-3 > button {
        height: 100% !important;
        min-height: 0 !important;
        min-width: 0;
        padding: 2px !important;
        font-size: clamp(11px, min(8vw, 5vh), 40px) !important;
        border-radius: clamp(4px, 4vmin, 22px) !important;
      }
      #mobile-scientific-drawer {
        flex: 1 1 43%;
        min-height: 0;
        overflow: auto;
        padding: clamp(3px, 1.5vmin, 10px);
        gap: clamp(2px, 1vmin, 6px);
        grid-auto-rows: minmax(0, 1fr);
      }
      #mobile-scientific-drawer button {
        min-height: 20px;
        font-size: clamp(9px, min(4vw, 3vh), 20px);
        padding: 2px;
      }
      #calculator-wrapper * {
        transition-property: background-color, color, transform;
      }
    </style>
  </head>
  <body>
    <!-- Calculator Container -->
    <div
      class="w-full max-w-[400px] md:max-w-[800px] transition-all duration-500 ease-in-out"
      id="calculator-wrapper"
    >
      <div
        class="glass-panel rounded-3xl overflow-hidden border-2 animate-fade-in flex flex-col md:flex-row"
      >
        <!-- Main Calculator Section -->
        <div class="flex-1 flex flex-col px-3 py-3 relative">
          <header id="calculator-header">
            <span id="calculator-title" tabindex="0">Calculator</span>
            <button
              id="theme-toggle"
              aria-label="Toggle color theme"
              title="Toggle color theme"
            >
              <svg
                id="icon-sun"
                viewBox="0 0 24 24"

    <script>
      const html = document.documentElement;
      const themeToggle = document.getElementById("theme-toggle");
      const resultDisplay = document.getElementById("result-display");
      const clearButton = document.getElementById("clear-button");
      const inputDisplay = document.getElementById("input-display");
      const historyDisplay = document.getElementById("history-display");
      const scientificPanel = document.getElementById("scientific-panel");
      const mobileScientificDrawer = document.getElementById(
        "mobile-scientific-drawer",
      );
      const calculatorWrapper = document.getElementById("calculator-wrapper");
      const modeIndicator = document.getElementById("mode-indicator");
      const btnBasic = document.getElementById("btn-basic");
      const btnScientific = document.getElementById("btn-scientific");
      const degRadToggle = document.getElementById("deg-rad-toggle");
      const mobileDegRadToggle = document.getElementById(
        "mobile-deg-rad-toggle",
      );
      const btnInv = document.getElementById("btn-inv");
      const mobileBtnInv = document.getElementById("mobile-btn-inv");

      let currentInput = "";
      let expression = "";
      let shouldResetDisplay = false;
      let mode = "basic";
      let isDegrees = true;
      let lastAnswer = "0";
      let isInverse = false;
      let hasError = false;

      function initTheme() {
        let savedTheme;
        try {
          savedTheme = localStorage.getItem("theme");
        } catch {}
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        html.classList.toggle(
          "dark",
          html.dataset.boardTheme
            ? html.dataset.boardTheme === "dark"
            : savedTheme
            ? savedTheme === "dark"
            : prefersDark,
        );
      }

      initTheme();

      themeToggle.addEventListener("click", () => {
        const isDark = html.classList.toggle("dark");
        try {
          localStorage.setItem("theme", isDark ? "dark" : "light");
        } catch {}
      });

      addEventListener("message", (event) => {
        if (
          event.source === parent &&
          event.data?.channel === "fc-calculator-theme" &&
          typeof event.data.dark === "boolean"
        ) {
          html.dataset.boardTheme = event.data.dark ? "dark" : "light";
          html.classList.toggle("dark", event.data.dark);
        }
      });
      const windowMessage = (type, event) =>
        parent.postMessage(
          {
            channel: "fc-resource-window",
            type,
            x: event?.screenX,
            y: event?.screenY,
          },
          "*",
        );
      document
        .getElementById("calculator-close")
        .addEventListener("click", () => windowMessage("close"));
      const handle = document.getElementById("calculator-title");
      let moving = false;
      handle.addEventListener("pointerdown", (event) => {
        if (event.isPrimary === false || event.button > 0) return;
        event.preventDefault();
        moving = true;
        handle.setPointerCapture(event.pointerId);
        windowMessage("move-start", event);
      });
      handle.addEventListener("pointermove", (event) => {
        if (moving) windowMessage("move", event);
      });
      handle.addEventListener("pointerup", (event) => {
        if (moving) {
          moving = false;
          windowMessage("move-end", event);
        }
      });
      handle.addEventListener("pointercancel", () => {
        moving = false;
        windowMessage("move-cancel");
      });
      handle.addEventListener("lostpointercapture", () => {
        if (moving) {
          moving = false;
          windowMessage("move-cancel");
        }
      });
      function getExpression() {
        return expression + currentInput;
      }

      function formatResult(value) {
        if (!Number.isFinite(value)) {
          throw new Error("Math error");
        }
        const rounded = Number(value.toPrecision(13));
        return Object.is(rounded, -0) ? "0" : String(rounded);
      }

      function tokenize(source) {
        const tokens = [];
        const tokenPattern =
          /\s*(?:(\d+(?:\.\d*)?|\.\d+)(?:[eE]([+-]?\d+))?|([a-zA-Z][a-zA-Z0-9]*)|([()+\-*/%^!×÷]))/gy;
        let position = 0;

        while (position < source.length) {
          tokenPattern.lastIndex = position;
          const match = tokenPattern.exec(source);
          if (!match) {
            throw new Error("Invalid expression");
          }
          position = tokenPattern.lastIndex;
          if (match[1] !== undefined) {
            const value = Number(
              match[1] + (match[2] === undefined ? "" : `e${match[2]}`),
            );
            if (!Number.isFinite(value)) throw new Error("Number out of range");
            tokens.push({ type: "number", value });
          } else if (match[3] !== undefined) {
            tokens.push({ type: "name", value: match[3] });
          } else {
            tokens.push({ type: "symbol", value: match[4] });
          }
        }

        return tokens;
      }

      function evaluate(source) {
        const tokens = tokenize(source);
        let cursor = 0;
        const peek = () => tokens[cursor];
        const consume = () => tokens[cursor++];
        const matchSymbol = (symbol) => {
          if (peek()?.type === "symbol" && peek().value === symbol) {
            consume();
            return true;
          }
          return false;
        };
        const toRadians = (value) =>
          isDegrees ? (value * Math.PI) / 180 : value;
        const fromRadians = (value) =>
          isDegrees ? (value * 180) / Math.PI : value;

        function parseExpression() {
          let value = parseTerm();
          while (
            peek()?.type === "symbol" &&
            ["+", "-"].includes(peek().value)
          ) {
            const operator = consume().value;
            const right = parseTerm();
            value = operator === "+" ? value + right : value - right;
          }
          return value;
        }

        function startsImplicitProduct(token) {
          return (
            token &&
            (token.type === "number" ||
              token.type === "name" ||
              (token.type === "symbol" && token.value === "("))
          );
        }

        function parseTerm() {
          let value = parseUnary();
          while (peek()) {
            if (
              peek().type === "symbol" &&
              ["*", "×", "/", "÷", "%"].includes(peek().value)
            ) {
              const operator = consume().value;
              const right = parseUnary();
              if (
                (operator === "/" || operator === "÷" || operator === "%") &&
                right === 0
              ) {
                throw new Error("Cannot divide by zero");
              }
              if (operator === "*" || operator === "×") value *= right;
              else if (operator === "/" || operator === "÷") value /= right;
              else value %= right;
            } else if (startsImplicitProduct(peek())) {
              value *= parseUnary();
            } else {
              break;
            }
          }
          return value;
        }

        function parseUnary() {
          if (matchSymbol("+")) return parseUnary();
          if (matchSymbol("-")) return -parseUnary();
          return parsePower();
        }

        function parsePower() {
          let value = parsePostfix();
          if (matchSymbol("^")) {
            value = Math.pow(value, parseUnary());
          }
          return value;
        }

        function parsePostfix() {
          let value = parsePrimary();
          while (matchSymbol("!")) {
            value = factorial(value);
          }
          return value;
        }

        function parsePrimary() {
          const token = consume();
          if (!token) throw new Error("Incomplete expression");
          if (token.type === "number") return token.value;

          if (token.type === "symbol" && token.value === "(") {
            const value = parseExpression();
            if (!matchSymbol(")"))
              throw new Error("Missing closing parenthesis");
            return value;
          }

          if (token.type === "name") {
            const name = token.value.toLowerCase();
            if (name === "pi") return Math.PI;
            if (name === "e") return Math.E;
            if (token.value === "Ans") return Number(lastAnswer);

            if (!matchSymbol("("))
              throw new Error("Function needs parentheses");
            const argument = parseExpression();
            if (!matchSymbol(")"))
              throw new Error("Missing closing parenthesis");
            const functions = {
              sin: (x) => Math.sin(toRadians(x)),
              cos: (x) => Math.cos(toRadians(x)),
              tan: (x) => {
                const radians = toRadians(x);
                if (Math.abs(Math.cos(radians)) < 1e-14)
                  throw new Error("Undefined");
                return Math.tan(radians);
              },
              asin: (x) => fromRadians(Math.asin(x)),
              acos: (x) => fromRadians(Math.acos(x)),
              atan: (x) => fromRadians(Math.atan(x)),
              sqrt: Math.sqrt,
              cbrt: Math.cbrt,
              exp: Math.exp,
              pow10: (x) => Math.pow(10, x),
              pct: (x) => x / 100,
              square: (x) => x ** 2,
              cube: (x) => x ** 3,
              reciprocal: (x) => {
                if (x === 0) throw new Error("Cannot divide by zero");
                return 1 / x;
              },
              log: Math.log10,
              ln: Math.log,
              abs: Math.abs,
              round: Math.round,
              floor: Math.floor,
              ceil: Math.ceil,
              fact: factorial,
            };
            if (!functions[name]) throw new Error("Unknown function");
            return functions[name](argument);
          }

          throw new Error("Invalid expression");
        }

        const result = parseExpression();
        if (cursor !== tokens.length) throw new Error("Invalid expression");
        return formatResult(result);
      }

      function closeOpenParentheses(source) {
        let depth = 0;
        for (const character of source) {
          if (character === "(") depth += 1;
          if (character === ")") depth -= 1;
          if (depth < 0) throw new Error("Invalid parentheses");
        }
        return source + ")".repeat(depth);
      }

      function updateDisplay() {
        const fullExpression = getExpression();
        clearButton.textContent = currentInput || hasError ? "C" : "AC";
        inputDisplay.textContent = (shouldResetDisplay ? "" : fullExpression)
          .replace(/\*/g, "×")
          .replace(/\//g, "÷");
        resultDisplay.textContent = hasError ? "Error" : currentInput || "0";

        if (
          !hasError &&
          fullExpression &&
          !/[+\-*/%^×÷.(]$/.test(fullExpression)
        ) {
          try {
            resultDisplay.textContent = evaluate(
              closeOpenParentheses(fullExpression),
            );
          } catch {
            // Partial expressions are expected while entering a calculation.
          }
        } else if (!hasError && !currentInput && expression) {
          const previousEntry = expression.replace(/[+\-*/%^×÷]$/, "");
          if (previousEntry && !/[.(]$/.test(previousEntry)) {
            try {
              resultDisplay.textContent = evaluate(
                closeOpenParentheses(previousEntry),
              );
            } catch {
              // Keep the last display for incomplete expressions.
            }
          }
        }

        resultDisplay.classList.toggle("calculator-error", hasError);
        resultDisplay.classList.toggle(
          "calculator-long-result",
          resultDisplay.textContent.length > 9,
        );
        checkDisplayLength();
      }

      function toggleAngleMode() {
        isDegrees = !isDegrees;
        const label = isDegrees ? "DEG" : "RAD";
        degRadToggle.textContent = label;
        mobileDegRadToggle.textContent = label;
        degRadToggle.setAttribute(
          "aria-label",
          `Switch angle unit (currently ${label})`,
        );
        mobileDegRadToggle.setAttribute(
          "aria-label",
          `Switch angle unit (currently ${label})`,
        );
        updateDisplay();
      }

      function updateInverseButtons() {
        const trig = [
          ["btn-sin", "mobile-btn-sin", "sin", "asin", "sine"],
          ["btn-cos", "mobile-btn-cos", "cos", "acos", "cosine"],
          ["btn-tan", "mobile-btn-tan", "tan", "atan", "tangent"],
        ];
        trig.forEach(([desktopId, mobileId, normal, inverse, description]) => {
          const label = isInverse ? `${normal}⁻¹` : normal;
          const fn = isInverse ? inverse : normal;
          [desktopId, mobileId].forEach((id) => {
            const button = document.getElementById(id);
            button.textContent = label;
            button.setAttribute("onclick", `appendFunc('${fn}(')`);
            button.setAttribute(
              "aria-label",
              isInverse ? `Inverse ${description}` : description,
            );
            button.title = isInverse
              ? `Inverse ${description}; result uses DEG/RAD mode`
              : `${description} (angle uses DEG/RAD mode)`;
          });
        });
      }

      function toggleInverse() {
        isInverse = !isInverse;
        [btnInv, mobileBtnInv].forEach((button) => {
          button.classList.toggle("inverse-active", isInverse);
          button.setAttribute("aria-pressed", String(isInverse));
        });
        updateInverseButtons();
      }

      function resetAfterError() {
        if (!hasError) return;
        hasError = false;
        currentInput = "";
        expression = "";
      }

      function appendNumber(number) {
        resetAfterError();
        if (shouldResetDisplay) {
          currentInput = number === "." ? "0." : number;
          expression = "";
          shouldResetDisplay = false;
        } else if (number === ".") {
          if (currentInput.includes(".")) return;
          currentInput = currentInput ? `${currentInput}.` : "0.";
        } else {
          currentInput = currentInput === "0" ? number : currentInput + number;
        }
        updateDisplay();
      }

      function appendOperator(operator) {
        resetAfterError();
        if (operator === "(") {
          if (currentInput) {
            expression += `${currentInput}×`;
            currentInput = "";
          } else if (/[)\w]$/.test(expression)) {
            expression += "×";
          }
          expression += "(";
          shouldResetDisplay = false;
          updateDisplay();
          return;
        }

        if (operator === ")") {
          if (currentInput) {
            expression += currentInput;
            currentInput = "";
          }
          const openCount = (expression.match(/\(/g) || []).length;
          const closeCount = (expression.match(/\)/g) || []).length;
          if (
            openCount > closeCount &&
            expression &&
            !/[+\-*/%^×÷(]$/.test(expression)
          ) {
            expression += ")";
          }
          shouldResetDisplay = false;
          updateDisplay();
          return;
        }

        if (currentInput) {
          expression += currentInput;
          currentInput = "";
        } else if (!expression) {
          if (operator !== "-") return;
        } else if (/[+\-*/%^×÷]$/.test(expression)) {
          if (operator === "-" && !expression.endsWith("-")) {
            expression += operator;
            shouldResetDisplay = false;
            updateDisplay();
            return;
          }
          expression = expression.slice(0, -1);
        }

        expression += operator;
        shouldResetDisplay = false;
        updateDisplay();
      }

      function appendFunc(func) {
        resetAfterError();
        if (currentInput) {
          expression += `${currentInput}×`;
          currentInput = "";
        } else if (/[)\w]$/.test(expression)) {
          expression += "×";
        }
        expression += func;
        shouldResetDisplay = false;
        updateDisplay();
      }

      function appendUnaryFunction(name) {
        resetAfterError();
        const operand = currentInput;

        if (operand) {
          const hasTrailingMinus = expression.endsWith("-");
          const prefix = hasTrailingMinus
            ? expression.slice(0, -1)
            : expression;
          const isUnarySign =
            hasTrailingMinus && (!prefix || /[+*/%^×÷(]$/.test(prefix));
          expression = isUnarySign
            ? `${prefix}${name}(-${operand})`
            : `${expression}${name}(${operand})`;
          currentInput = "";
          shouldResetDisplay = false;
          updateDisplay();
          return;
        }

        if (expression && !/[+\-*/%^×÷(]$/.test(expression)) {
          expression = `${name}(${expression})`;
          shouldResetDisplay = false;
          updateDisplay();
          return;
        }

        appendFunc(`${name}(`);
      }

      function appendConstant(constant) {
        resetAfterError();
        if (currentInput) {
          expression += `${currentInput}×`;
          currentInput = "";
        } else if (/[)\w]$/.test(expression)) {
          expression += "×";
        }
        expression += constant === "PI" ? "PI" : "E";
        shouldResetDisplay = false;
        updateDisplay();
      }

      function useAns() {
        resetAfterError();
        if (shouldResetDisplay) {
          expression = "";
          currentInput = lastAnswer;
          shouldResetDisplay = false;
        } else {
          if (currentInput) {
            expression += `${currentInput}×`;
            currentInput = "";
          } else if (/[)\w]$/.test(expression)) {
            expression += "×";
          }
          currentInput = lastAnswer;
        }
        updateDisplay();
      }

      function clearAll() {
        currentInput = "";
        expression = "";
        shouldResetDisplay = false;
        hasError = false;
        historyDisplay.textContent = "";
        updateDisplay();
      }

      function clearCalculator() {
        if (clearButton.textContent === "AC" || hasError) {
          clearAll();
          return;
        }
        currentInput = "";
        hasError = false;
        shouldResetDisplay = false;
        updateDisplay();
      }

      function deleteChar() {
        if (hasError) {
          clearAll();
          return;
        }
        shouldResetDisplay = false;
        if (currentInput) {
          currentInput = currentInput.slice(0, -1);
        } else if (expression) {
          expression = expression.slice(0, -1);
        }
        updateDisplay();
      }

      function factorial(value) {
        if (!Number.isInteger(value) || value < 0 || value > 170) {
          throw new Error("Factorial requires an integer from 0 to 170");
        }
        let result = 1;
        for (let number = 2; number <= value; number += 1) result *= number;
        return result;
      }

      function calculate() {
        if (hasError) return;
        const source = getExpression();
        if (!source) return;

        try {
          const completedExpression = closeOpenParentheses(source);
          const answer = evaluate(completedExpression);
          historyDisplay.textContent = `${completedExpression
            .replace(/\*/g, "×")
            .replace(/\//g, "÷")} =`;
          currentInput = answer;
          lastAnswer = answer;
          expression = "";
          shouldResetDisplay = true;
          hasError = false;
        } catch {
          hasError = true;
          currentInput = "";
          historyDisplay.textContent = "Check your expression";
          shouldResetDisplay = false;
        }
        updateDisplay();
      }

      function setMode(newMode) {
        mode = newMode;
        const scientific = mode === "scientific";
        modeIndicator.style.transform = scientific
          ? "translateX(100%)"
          : "translateX(0)";
        btnBasic.classList.toggle("mode-selected", !scientific);
        btnScientific.classList.toggle("mode-selected", scientific);
        scientificPanel.classList.toggle("hidden", !scientific);
        scientificPanel.classList.toggle("w-0", !scientific);
        scientificPanel.classList.toggle("opacity-0", !scientific);
        scientificPanel.classList.toggle("w-64", scientific);
        scientificPanel.classList.toggle("opacity-100", scientific);
        scientificPanel.classList.toggle("p-6", scientific);
        calculatorWrapper.classList.toggle("scientific-open", scientific);
        mobileScientificDrawer.classList.toggle("hidden", !scientific);
        mobileScientificDrawer.classList.toggle("grid", scientific);
      }

      function checkDisplayLength() {
        const container = document.getElementById("result_display_container");
        container.style.minHeight =
          resultDisplay.textContent.length > 18 ? "150px" : "130px";
      }

      function triggerKeyFeedback(key) {
        const button = document.querySelector(`button[data-key="${key}"]`);
        if (!button) return;
        button.classList.add("btn-active");
        window.setTimeout(() => button.classList.remove("btn-active"), 120);
      }

      document.addEventListener("keydown", (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        const { key } = event;
        if (/^\d$/.test(key)) {
          event.preventDefault();
          appendNumber(key);
          triggerKeyFeedback(key);
        } else if (key === ".") {
          event.preventDefault();
          appendNumber(".");
          triggerKeyFeedback(key);
        } else if (["+", "-", "*", "/", "%", "^", "(", ")"].includes(key)) {
          event.preventDefault();
          appendOperator(key === "*" ? "×" : key === "/" ? "÷" : key);
          triggerKeyFeedback(key);
        } else if (key === "Enter" || key === "=") {
          event.preventDefault();
          calculate();
          triggerKeyFeedback("Enter");
        } else if (key === "Backspace") {
          event.preventDefault();
          deleteChar();
          triggerKeyFeedback("Backspace");
        } else if (key === "Escape") {
          event.preventDefault();
          clearAll();
          triggerKeyFeedback("Escape");
        } else if (key.toLowerCase() === "s" && mode === "scientific") {
          appendFunc(`${isInverse ? "asin" : "sin"}(`);
        } else if (key.toLowerCase() === "c" && mode === "scientific") {
          appendFunc(`${isInverse ? "acos" : "cos"}(`);
        } else if (key.toLowerCase() === "t" && mode === "scientific") {
          appendFunc(`${isInverse ? "atan" : "tan"}(`);
        } else if (key.toLowerCase() === "l" && mode === "scientific") {
          appendFunc("log(");
        } else if (key.toLowerCase() === "p" && mode === "scientific") {
          appendConstant("PI");
        } else if (key.toLowerCase() === "e" && mode === "scientific") {
          appendConstant("E");
        }
      });

      setMode("basic");
      updateDisplay();
    </script>
  </body>
</html>
