<!DOCTYPE html>
<html lang="__LANG__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__ · Fcboard</title>
    <style>
      html {
        color-scheme: light;
      }
      body {
        font: 16px/1.55 system-ui, sans-serif;
        color: #262a25;
        background: #e9ede5;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        box-sizing: border-box;
        width: min(32rem, calc(100% - 2rem));
        padding: clamp(1.5rem, 6vw, 3rem);
        border: 1px solid #fff;
        border-radius: 1.5rem;
        background: #fffef7;
        box-shadow: 0 1rem 4rem #38453524;
      }
      h1 {
        margin: 0;
        font-size: 1.65rem;
      }
      p {
        overflow-wrap: anywhere;
      }
      button {
        min-height: 3rem;
        background: #344c3e;
        color: white;
        border: 0;
        border-radius: 0.8rem;
        padding: 0.5rem 1.2rem;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
    <script type="application/json" id="messages">__MESSAGES__</script>
    <script src="sender.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="title">__TITLE__</h1>
      <p id="status" role="status">__READY__</p>
      <button type="button" id="cast" disabled>__CHOOSE__</button>
      <button type="button" id="stop" hidden>__STOP__</button>
    </main>
  </body>
</html>
