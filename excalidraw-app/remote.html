<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>· 设备控制</title>
  </head>
  <body>
    <main>
      <header>
        <strong>方成教育</strong
        ><span id="status" role="status">与大屏配对</span>
      </header>
      <section id="setup">
        <form id="authorize">
          <label
            >大屏配对码<input
              name="pin"
              autocomplete="one-time-code"
              inputmode="numeric"
              pattern="[0-9]{6}"
              minlength="6"
              maxlength="6"
              required
          /></label>
          <button>配对</button>
        </form>
        <form id="adb" hidden>
          <p>
            在大屏系统设置中打开“无线调试”。配对端口与配对码来自“使用配对码配对设备”对话框；连接端口来自无线调试主页。保持配对对话框打开，再从这里连接。
          </p>
          <label
            >连接端口<input
              name="port"
              inputmode="numeric"
              type="number"
              min="1"
              max="65535"
              required
          /></label>
          <label
            >配对端口<input
              name="pairPort"
              inputmode="numeric"
              type="number"
              min="1"
              max="65535"
          /></label>
          <label
            >安卓配对码<input
              name="code"
              inputmode="numeric"
              pattern="[0-9]{6}"
              minlength="6"
              maxlength="6"
          /></label>
          <small>已配对的设备只需填写连接端口。</small>
          <button>连接大屏</button>
        </form>
      </section>
      <section id="screen" aria-label="大屏实时画面" hidden>
        <canvas tabindex="0" aria-label="触摸控制大屏"></canvas>
      </section>
      <nav id="controls" aria-label="设备操作" hidden>
        <button data-key="4" aria-label="返回">
          <span>←</span><small>返回</small>
        </button>
        <button data-key="3" aria-label="主屏幕">
          <span>⌂</span><small>主屏</small>
        </button>
        <button data-key="187" aria-label="最近应用">
          <span>▢</span><small>应用</small>
        </button>
        <button id="type"><span>⌨</span><small>文字</small></button>
        <button id="fullscreen"><span>⛶</span><small>全屏</small></button>
        <button id="disconnect" aria-label="断开">
          <span aria-hidden="true">×</span><small>断开</small>
        </button>
      </nav>
      <form id="text" hidden>
        <label class="sr-only" for="message">输入到大屏</label
        ><input
          id="message"
          autocomplete="off"
          placeholder="输入到大屏，支持中文"
        /><button>发送</button>
      </form>
    </main>
    <script type="module" src="/fcdraw/remoteClient.ts"></script>
  </body>
</html>
