name: Fcboard verification and Android APK

on:
  push:
    branches: [main]
    paths-ignore: [history.md, docs/README.md]
  pull_request:
  workflow_dispatch:

# Node 22.21+ fetch otherwise ignores the runner's trusted proxy environment.
env:
  NODE_USE_ENV_PROXY: "1"

permissions:
  contents: read

concurrency:
  group: fcboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm lint
      - name: Lint cloud sharing service
        run: pnpm exec eslint --max-warnings=0 services/board-share/*.mjs
      - run: pnpm test:other
      - run: pnpm test
      - name: Verify model replacement and integrity rules
        run: python3 -m unittest discover -s scripts -p test_tts_models.py
      - name: Verify optional IndexTTS adapter
        run: python -m unittest discover -s services/index-tts -p 'test_*.py'

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package web application
        # Models and runtime are shipped with the app; no first-use CDN download.
        run: |
          node scripts/fetch-ocr-models.mjs
          node scripts/fetch-local-models.mjs
          python3 scripts/fetch-dictionary.py
      - name: Package Android visual interaction assets without browser inference
        timeout-minutes: 8
        run: pnpm --dir app exec vite build
        env:
          VITE_NATIVE_INFERENCE: "true"
          NODE_OPTIONS: "--max-old-space-size=6144"
          VITE_APP_ENABLE_TRACKING: "false"
          VITE_APP_DISABLE_SENTRY: "true"
      - run: pnpm --dir app exec cap sync android
        env:
          VITE_NATIVE_INFERENCE: "true"
      - name: Bundle native inference models outside WebView
        run: node scripts/prepare-native-inference.mjs
      - uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/speech
          key: fcboard-speech-${{ hashFiles('scripts/speech-models.json') }}
      - name: Bundle offline Chinese speech model
        run: node scripts/fetch-speech-models.mjs
      - uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/assets/tts
            android/app/libs/sherpa-onnx-1.13.8.aar
          key: fcboard-tts-${{ hashFiles('scripts/tts-models.json') }}
      - name: Bundle verified offline Chinese and English narration
        run: python3 scripts/fetch-tts-models.py
      - name: Prepare verified native ONNX runtimes without duplicate libraries
        run: |
          python3 -m unittest discover -s scripts -p test_android_ort.py
          python3 scripts/prepare-android-ort.py
      - name: Bundle verified offline Digital Ink models
        run: python3 scripts/fetch-ink-models.py
      - name: Package Android
        id: android-package
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Package whiteboard web assets
        timeout-minutes: 8
        run: pnpm --dir app exec vite build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          VITE_APP_ENABLE_TRACKING: "false"
          VITE_APP_DISABLE_SENTRY: "true"
      - name: Report packaged models and native library sizes
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        run: python3 scripts/apk-size-report.py >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Android unit tests and lint
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
      - name: Enable emulator acceleration
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and verify emulator with download retries
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          for attempt in 1 2 3; do
            if sdkmanager --install emulator --channel=0 && "$ANDROID_HOME/emulator/emulator" -version; then
              exit 0
            fi
            echo "Emulator download attempt $attempt failed; retrying the SDK installation."
            sdkmanager --uninstall emulator || true
            sleep 5
          done
          exit 1
      - name: Verify offline handwriting, speech, narration and screen capture on Android
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          # Headless runs reported invalid Vulkan color buffers before WebView stopped replying.
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          script: bash scripts/verify-android-runtime.sh
      - name: Install browser for layout and interaction checks
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production whiteboard interactions
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        run: |
          node scripts/fetch-courseware-fixtures.mjs
          pnpm exec playwright test --config config/playwright.config.ts
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        if: always()
        with:
          name: Fcboard-UI-verification
          path: test-results
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        if: always()
        with:
          name: Fcboard-Android-verification
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            android/app/build/outputs/connected_android_test_additional_output
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: Fcboard-Web
          path: app/build
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        with:
          name: Fcboard-Android-APK-arm64-v8a
          path: android/app/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        with:
          name: Fcboard-Android-APK-armeabi-v7a
          path: android/app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        with:
          name: Fcboard-Android-APK-x86
          path: android/app/build/outputs/apk/debug/*-x86-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.android-package.outcome == 'success' }}
        with:
          name: Fcboard-Android-APK-x86_64
          path: android/app/build/outputs/apk/debug/*-x86_64-debug.apk
          if-no-files-found: error
      - name: Upload deployable live-share service and matching viewer
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: Fcboard-Live-Share
          path: |
            services/board-share/server.mjs
            services/board-share/transfers.mjs
            services/board-share/package.json
            services/board-share/README.md
            services/board-share/deploy
            app/build
          if-no-files-found: error
