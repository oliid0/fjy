name: Fcboard verification and Android APK

on:
  push:
    branches: [main]
    paths-ignore: [history.md, README.md]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fcboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:other
      - run: pnpm test
      - name: Verify optional IndexTTS adapter
        run: python -m unittest discover -s services/index-tts -p 'test_*.py'

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Package web application
        # Models and runtime are shipped with the app; no first-use CDN download.
        run: node scripts/fetch-ocr-models.mjs
      - name: Package whiteboard web assets
        run: pnpm --dir app exec vite build
        env:
          VITE_APP_ENABLE_TRACKING: "false"
          VITE_APP_DISABLE_SENTRY: "true"
      - run: pnpm exec cap sync android
      - uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/speech
          key: fcboard-speech-${{ hashFiles('scripts/speech-models.json') }}
      - name: Bundle offline Chinese speech model
        run: node scripts/fetch-speech-models.mjs
      - name: Bundle verified offline Digital Ink models
        run: python3 scripts/fetch-ink-models.py
      - name: Package and verify Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Fcboard-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Install browser for layout and interaction checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production whiteboard interactions
        run: |
          node scripts/fetch-courseware-fixtures.mjs
          pnpm exec playwright test
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline speech and screen capture on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fcboard-UI-verification
          path: test-results
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fcboard-Android-verification
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
            android/app/build/outputs/connected_android_test_additional_output
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Fcboard-Web
          path: app/build
          if-no-files-found: error
